<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FLORK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      position: relative;
    }

    /* Enter the Void inspired psychedelic background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 0, 150, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 0, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 60% 40%, rgba(150, 0, 255, 0.3) 0%, transparent 50%);
      animation: voidPulse 4s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes voidPulse {
      0% {
        opacity: 0.3;
        transform: scale(1);
        filter: hue-rotate(0deg);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.1);
        filter: hue-rotate(90deg);
      }
      100% {
        opacity: 0.4;
        transform: scale(0.9);
        filter: hue-rotate(180deg);
      }
    }

    /* Glitch effect overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 98%, rgba(255, 0, 0, 0.1) 100%),
        linear-gradient(0deg, transparent 98%, rgba(0, 255, 255, 0.1) 100%);
      background-size: 3px 3px;
      animation: glitch 0.1s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(-1px, -1px); }
      60% { transform: translate(1px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    .image-container {
      position: relative;
      width: 80%;
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .meme-layer {
      max-width: 100%;
      max-height: 100%;
      border-radius: 5px;
      box-shadow: 
        0 0 20px rgba(255, 0, 150, 0.5),
        0 0 40px rgba(0, 255, 255, 0.3),
        0 0 60px rgba(255, 255, 0, 0.2);
      animation: imageGlow 2s ease-in-out infinite alternate;
      filter: contrast(1.2) saturate(1.3);
      transition: all 0.4s ease;
    }

    @keyframes imageGlow {
      0% {
        box-shadow: 
          0 0 20px rgba(255, 0, 150, 0.5),
          0 0 40px rgba(0, 255, 255, 0.3),
          0 0 60px rgba(255, 255, 0, 0.2);
        filter: contrast(1.2) saturate(1.3) hue-rotate(0deg);
      }
      100% {
        box-shadow: 
          0 0 30px rgba(255, 0, 150, 0.8),
          0 0 60px rgba(0, 255, 255, 0.6),
          0 0 90px rgba(255, 255, 0, 0.4);
        filter: contrast(1.4) saturate(1.6) hue-rotate(30deg);
      }
    }

    .start-button-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
    }

    .big-start-button {
      position: relative;
      width: 200px;
      height: 200px;
      border: 3px solid #00ffff;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 
        0 0 30px rgba(0, 255, 255, 0.5),
        inset 0 0 30px rgba(0, 255, 255, 0.1);
      opacity: 1;
      pointer-events: auto;
    }

    .big-start-button:hover {
      transform: scale(1.1);
      box-shadow: 
        0 0 50px rgba(0, 255, 255, 0.8),
        inset 0 0 50px rgba(0, 255, 255, 0.2);
      border-color: #ff0096;
    }

    .big-start-button:active {
      transform: scale(0.95);
      box-shadow: 
        0 0 20px rgba(255, 0, 150, 0.6),
        inset 0 0 20px rgba(255, 0, 150, 0.3);
    }

    .button-text {
      font-family: 'Courier New', monospace;
      font-size: 2rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      letter-spacing: 3px;
      z-index: 2;
      position: relative;
    }

    .button-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
      animation: buttonPulse 2s ease-in-out infinite alternate;
      z-index: 1;
    }

    @keyframes buttonPulse {
      0% {
        opacity: 0.5;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .big-start-button.stopped .button-text {
      color: #00ffff;
    }

    .big-start-button.playing .button-text {
      color: #ff0096;
      text-shadow: 0 0 20px rgba(255, 0, 150, 0.8);
    }

    .big-start-button.playing .button-glow {
      background: radial-gradient(circle, rgba(255, 0, 150, 0.3) 0%, transparent 70%);
    }

    .token-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff0096;
      text-align: center;
      z-index: 100;
      text-shadow: 0 0 15px rgba(255, 0, 150, 0.8);
    }

    .token-symbol {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      animation: symbolPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes symbolPulse {
      0% {
        text-shadow: 0 0 15px rgba(255, 0, 150, 0.8);
        transform: scale(1);
      }
      100% {
        text-shadow: 0 0 25px rgba(255, 0, 150, 1), 0 0 35px rgba(0, 255, 255, 0.6);
        transform: scale(1.05);
      }
    }

    /* Gentle pulse animation for musical moments */
    @keyframes extremePulse {
      0% { 
        transform: scale(1) rotate(0deg);
        filter: brightness(1) contrast(1) saturate(1);
      }
      50% { 
        transform: scale(1.02) rotate(0.5deg);
        filter: brightness(1.1) contrast(1.05) saturate(1.1);
      }
      100% { 
        transform: scale(0.98) rotate(-0.5deg);
        filter: brightness(0.95) contrast(1.02) saturate(0.95);
      }
    }

    /* Extreme glitch effect for maximum intensity */
    @keyframes extremeGlitch {
      0% { transform: translate(0) rotate(0deg); }
      10% { transform: translate(-3px, 3px) rotate(1deg); }
      20% { transform: translate(-3px, -3px) rotate(-1deg); }
      30% { transform: translate(3px, 3px) rotate(1deg); }
      40% { transform: translate(3px, -3px) rotate(-1deg); }
      50% { transform: translate(-2px, 2px) rotate(0.5deg); }
      60% { transform: translate(2px, -2px) rotate(-0.5deg); }
      70% { transform: translate(-1px, 1px) rotate(0.2deg); }
      80% { transform: translate(1px, -1px) rotate(-0.2deg); }
      90% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(0) rotate(0deg); }
    }

    .token-address {
      font-size: 0.9rem;
      opacity: 0.9;
      color: #ffff00;
      text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
    }

    button {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ffff;
      color: #00ffff;
      padding: 8px 16px;
      border-radius: 0;
      cursor: pointer;
      margin: 5px;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    button:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    button:active {
      background: rgba(255, 0, 150, 0.3);
      border-color: #ff0096;
      box-shadow: 0 0 15px rgba(255, 0, 150, 0.6);
    }

    /* Scanline effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 255, 0.03) 2px,
        rgba(0, 255, 255, 0.03) 4px
      );
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="start-button-container">
    <button id="startButton" class="big-start-button" onclick="toggleStart()">
      <span class="button-text">START</span>
      <span class="button-glow"></span>
    </button>
  </div>
  
  <div id="imageContainer" class="image-container">
    <img id="currentMeme" class="meme-layer" src="memes/flork_1.jpg" alt="">
  </div>
  
  <div class="token-info">
    <div class="token-symbol">$FORK</div>
    <div class="token-address">CA: 4dECjiqwxeGrX7eGgYbMNRg5ib5RkjFA2kbTsDdYpump</div>
  </div>

  <!-- Scanline effect overlay -->
  <div class="scanlines"></div>

  <script src="audio-analysis.js"></script>
  <script>
    const total = 141;
    let index = 1;
    const currentMeme = document.getElementById("currentMeme");
    const startButton = document.getElementById("startButton");
    let audio = null;
    let animationId = null;
    let lastImageTime = 0;
    let isPlaying = false;

    // Generate the correct filename based on index
    function getImagePath(index) {
      return `memes/flork_${index}.jpg`;
    }

    // Get current intensity from comprehensive audio analysis - BALANCED VERSION
    function getCurrentIntensity(currentTime) {
      if (timingMap.length === 0) return 0.5; // Default if no timing map
      
      // Use the comprehensive audio state function
      const audioState = getCurrentAudioState(currentTime);
      
      // Combine multiple factors for balanced dynamic response
      const intensity = audioState.intensity;
      const rhythmSpeed = audioState.rhythmSpeed;
      const energy = audioState.energy;
      const bpm = audioState.bpm;
      
      // Create a balanced intensity calculation
      // Base intensity from beat detection
      let finalIntensity = intensity;
      
      // Strong boost intensity based on rhythm speed (more responsive to fast music)
      const speedBoost = Math.min(0.4, (rhythmSpeed - 1.0) * 0.2);
      finalIntensity += speedBoost;
      
      // Moderate boost intensity based on energy peaks
      const energyBoost = Math.min(0.3, energy * 0.4);
      finalIntensity += energyBoost;
      
      // Strong boost intensity based on BPM (more responsive to fast BPM)
      const bpmBoost = Math.min(0.3, (bpm - 100) / 200);
      finalIntensity += bpmBoost;
      
      // Add subtle random variation for natural feel
      const randomVariation = (Math.random() - 0.5) * 0.1; // ±5% variation
      finalIntensity += randomVariation;
      
      // Scale to 0.2-1.0 range for balanced effect
      finalIntensity = Math.max(0.2, Math.min(1.0, finalIntensity));
      
      return finalIntensity;
    }

    function toggleStart() {
      if (isPlaying) {
        pause();
      } else {
        start();
      }
    }

    async function start() {
      try {
        if (!audio) {
          // Create audio element if it doesn't exist
          audio = new Audio("sound_short.mp3");
          audio.loop = true;
          audio.startTime = Date.now();
        }
        
        // Resume audio
        await audio.play();
        isPlaying = true;
        
        // Update button
        startButton.classList.remove('stopped');
        startButton.classList.add('playing');
        startButton.querySelector('.button-text').textContent = 'PAUSE';
        
        // Hide button after a short delay
        setTimeout(() => {
          startButton.style.opacity = '0';
          startButton.style.pointerEvents = 'none';
        }, 1000);
        
        // Start rhythm-based image changes
        startRhythmDisplay();
        
      } catch (error) {
        console.log("Audio start failed:", error);
        alert("Audio failed to start. Make sure the sound.mp3 file exists in the same folder.");
      }
    }

    function pause() {
      isPlaying = false;
      
      if (audio) {
        audio.pause();
      }
      
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      
      // Show button again
      startButton.style.opacity = '1';
      startButton.style.pointerEvents = 'auto';
      startButton.classList.remove('playing');
      startButton.classList.add('stopped');
      startButton.querySelector('.button-text').textContent = 'START';
    }

    function startRhythmDisplay() {
      if (!isPlaying) return;
      
      const now = Date.now();
      const currentTime = audio.currentTime; // Use actual audio time
      
      // Get intensity from timing map based on actual audio time
      const intensity = getCurrentIntensity(currentTime);
      
      // Calculate display time based on intensity and rhythm speed - DYNAMIC differences
      // Higher intensity = shorter display time (faster changes)
      const minDisplayTime = 100; // Fastest (100ms) - very fast during intense parts
      const maxDisplayTime = 800; // Slowest (800ms) - slower during quiet parts
      
      // Get rhythm speed for speed-based timing
      const audioState = getCurrentAudioState(currentTime);
      const speedMultiplier = Math.min(2.0, audioState.rhythmSpeed);
      
      // Use speed-aware scaling for more dynamic feel
      const speedAdjustedIntensity = intensity * speedMultiplier;
      const displayTime = maxDisplayTime - (speedAdjustedIntensity * (maxDisplayTime - minDisplayTime));
      
      // Debug logging (remove this later)
      if (Math.floor(currentTime) !== Math.floor(currentTime - 0.1)) {
        console.log(`Time: ${currentTime.toFixed(1)}s, Intensity: ${intensity.toFixed(3)}, DisplayTime: ${displayTime.toFixed(0)}ms`);
      }
      
      // Change image if enough time has passed
      if (now - lastImageTime > displayTime) {
        changeImage();
        lastImageTime = now;
      }
      
      // Continue rhythm analysis
      animationId = requestAnimationFrame(startRhythmDisplay);
    }

    function changeImage() {
      // Get next image
      index = (index % total) + 1;
      const imagePath = getImagePath(index);
      
      // Get comprehensive audio state for advanced visual effects
      const currentTime = audio ? audio.currentTime : 0;
      const audioState = getCurrentAudioState(currentTime);
      const intensity = getCurrentIntensity(currentTime);
      
      // Fade out current image
      currentMeme.style.opacity = '0';
      
      // Change image after fade out
      setTimeout(() => {
        currentMeme.src = imagePath;
        currentMeme.style.opacity = '1';
        
        // DYNAMIC visual effects based on comprehensive audio analysis
        // More dramatic scaling when music is faster
        const speedMultiplier = Math.min(2.0, audioState.rhythmSpeed); // Boost effects for fast music
        const baseScale = 1 + (intensity * 0.4 * speedMultiplier); // Scale from 1.0 to 1.8 for fast music
        const scale = baseScale;
        
        // More dramatic brightness and contrast for fast music
        const brightness = 1 + (intensity * 0.6 * speedMultiplier); // Brightness from 1.0 to 2.2 for fast music
        const contrast = 1 + (intensity * 0.4 * speedMultiplier); // Contrast from 1.0 to 1.8 for fast music
        const saturation = 1 + (intensity * 0.5 * speedMultiplier); // Saturation from 1.0 to 2.0 for fast music
        
        // More dramatic rotation when music is faster
        const rotationDirection = Math.random() > 0.5 ? 1 : -1;
        const baseRotation = (audioState.rhythmSpeed - 1.0) * 6 * rotationDirection * speedMultiplier; // -12 to +12 degrees for fast music
        const randomRotation = (Math.random() - 0.5) * 4 * intensity * speedMultiplier; // Random -4 to +4 degrees for fast music
        const rotation = baseRotation + randomRotation;
        
        // More dramatic hue shift for fast music
        const baseHueShift = (audioState.bpm - 100) * 0.8 * speedMultiplier; // -160 to +160 degrees for fast music
        const randomHueShift = (Math.random() - 0.5) * 40 * intensity * speedMultiplier; // Random hue shifts
        const hueShift = baseHueShift + randomHueShift;
        
        // More dramatic position movement for fast music
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const maxOffsetX = (screenWidth - 400) / 3; // Larger offset for fast music
        const maxOffsetY = (screenHeight - 400) / 3;
        
        const randomX = (Math.random() - 0.5) * maxOffsetX * intensity * speedMultiplier; // More movement for fast music
        const randomY = (Math.random() - 0.5) * maxOffsetY * intensity * speedMultiplier;
        
        // Apply extreme transforms
        currentMeme.style.transform = `scale(${scale}) rotate(${rotation}deg) translate(${randomX}px, ${randomY}px)`;
        currentMeme.style.filter = `brightness(${brightness}) contrast(${contrast}) saturate(${saturation}) hue-rotate(${hueShift}deg)`;
        
        // Dynamic glow effects that get crazier for fast music
        if (intensity > 0.6) {
          const glowIntensity = intensity * 30 * speedMultiplier; // Bigger glow for fast music
          const glowColor1 = `rgba(255, 0, 255, ${intensity * 0.4})`;
          const glowColor2 = `rgba(0, 255, 255, ${intensity * 0.3})`;
          
          if (speedMultiplier > 1.5) {
            // Multiple glow layers for very fast music
            currentMeme.style.boxShadow = `
              0 0 ${glowIntensity}px ${glowColor1},
              0 0 ${glowIntensity * 1.5}px ${glowColor2}
            `;
          } else {
            // Single glow for moderate speed
            currentMeme.style.boxShadow = `0 0 ${glowIntensity}px ${glowColor1}`;
          }
        } else {
          currentMeme.style.boxShadow = 'none';
        }
        
        // Add subtle blur effect for very high intensity
        if (intensity > 0.9) {
          const blurAmount = (intensity - 0.9) * 2; // 0 to 0.2px blur
          currentMeme.style.filter += ` blur(${blurAmount}px)`;
        }
        
        // Add dynamic animation keyframes that get crazier for fast music
        if (intensity > 0.7) {
          const animationSpeed = 400 / (intensity * speedMultiplier); // Faster animations for fast music
          if (speedMultiplier > 1.8) {
            // Very fast music - use glitch effect
            currentMeme.style.animation = `extremeGlitch ${animationSpeed}ms infinite`;
          } else if (speedMultiplier > 1.3) {
            // Fast music - intense pulse
            currentMeme.style.animation = `extremePulse ${animationSpeed}ms infinite alternate`;
          } else {
            // Moderate music - gentle pulse
            currentMeme.style.animation = `extremePulse ${animationSpeed * 1.5}ms infinite alternate`;
          }
        } else {
          currentMeme.style.animation = 'none';
        }
        
        // Reset effects after a short time
        setTimeout(() => {
          currentMeme.style.transform = 'scale(1) rotate(0deg) translate(0px, 0px)';
          currentMeme.style.filter = 'brightness(1) contrast(1) saturate(1) hue-rotate(0deg) blur(0px)';
          currentMeme.style.boxShadow = 'none';
          currentMeme.style.animation = 'none';
        }, 300);
      }, 200); // Smoother transitions for musical feel
    }
  </script>
</body>
</html>
