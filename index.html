    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      position: relative;

    /* Enter the Void inspired psychedelic background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 0, 150, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(255, 255, 0, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 60% 40%, rgba(150, 0, 255, 0.3) 0%, transparent 50%);
      animation: voidPulse 4s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes voidPulse {
      0% {
        opacity: 0.3;
        transform: scale(1);
        filter: hue-rotate(0deg);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.1);
        filter: hue-rotate(90deg);
      }
      100% {
        opacity: 0.4;
        transform: scale(0.9);
        filter: hue-rotate(180deg);
      }
    }

    /* Glitch effect overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 98%, rgba(255, 0, 0, 0.1) 100%),
        linear-gradient(0deg, transparent 98%, rgba(0, 255, 255, 0.1) 100%);
      background-size: 3px 3px;
      animation: glitch 0.1s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(-1px, -1px); }
      60% { transform: translate(1px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    .image-container {
      position: relative;
      width: 80%;
      height: 80%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .meme-layer {
      max-width: 100%;
      max-height: 100%;
      border-radius: 5px;
      box-shadow: 
        0 0 20px rgba(255, 0, 150, 0.5),
        0 0 40px rgba(0, 255, 255, 0.3),
        0 0 60px rgba(255, 255, 0, 0.2);
      animation: imageGlow 2s ease-in-out infinite alternate;
      filter: contrast(1.2) saturate(1.3);
      transition: all 0.4s ease;
    }

    @keyframes imageGlow {
      0% {
        box-shadow: 
          0 0 20px rgba(255, 0, 150, 0.5),
          0 0 40px rgba(0, 255, 255, 0.3),
          0 0 60px rgba(255, 255, 0, 0.2);
        filter: contrast(1.2) saturate(1.3) hue-rotate(0deg);
      }
      100% {
        box-shadow: 
          0 0 30px rgba(255, 0, 150, 0.8),
          0 0 60px rgba(0, 255, 255, 0.6),
          0 0 90px rgba(255, 255, 0, 0.4);
        filter: contrast(1.4) saturate(1.6) hue-rotate(30deg);
      }
    }

    .start-button-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
    }

    .big-start-button {
      position: relative;
      width: 200px;
      height: 200px;
      border: 3px solid #00ffff;
      background: rgba(0, 0, 0, 0.8);

        0 0 30px rgba(0, 255, 255, 0.5),

    .big-start-button:hover {
      transform: scale(1.1);

    .big-start-button:active {

    .button-text {

    .button-glow {

    /* Gentle pulse animation for musical moments */

      100% {

        filter: brightness(0.95) contrast(1.02) saturate(0.95);
      }
    }

    /* Extreme glitch effect for maximum intensity - PRESERVE CENTERING */
    @keyframes extremeGlitch {
      0% { transform: translate(-50%, -50%) translate(0) rotate(0deg); }
      10% { transform: translate(-50%, -50%) translate(-3px, 3px) rotate(1deg); }
      20% { transform: translate(-50%, -50%) translate(-3px, -3px) rotate(-1deg); }
      30% { transform: translate(-50%, -50%) translate(3px, 3px) rotate(1deg); }
      40% { transform: translate(-50%, -50%) translate(3px, -3px) rotate(-1deg); }
      50% { transform: translate(-50%, -50%) translate(-2px, 2px) rotate(0.5deg); }
      60% { transform: translate(-50%, -50%) translate(2px, -2px) rotate(-0.5deg); }
      70% { transform: translate(-50%, -50%) translate(-1px, 1px) rotate(0.2deg); }
      80% { transform: translate(-50%, -50%) translate(1px, -1px) rotate(-0.2deg); }
      90% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
      100% { transform: translate(-50%, -50%) translate(0) rotate(0deg); }
    }

    .token-address {
      font-size: 0.9rem;
      opacity: 0.9;
      color: #ffff00;

    button {
      background: rgba(0, 0, 0, 0.8);

    button:active {

    /* Scanline effect */
    .scanlines {

    /* Loading indicator */
    .loading-indicator {

    @keyframes loadingPulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }

  </style>

  <script src="audio-analysis.js"></script>
  <script>
    const total = 141;
    let index = 1;
    const startButton = document.getElementById("startButton");
    let audio = null;
    let animationId = null;
    let lastImageTime = 0;
    let isPlaying = false;
    let imagesPreloaded = false;
    let allImageElements = [];
    let currentVisibleImage = null;
    let effectTimeouts = {}; // Store timeouts for each image to clear them
    let currentZIndex = 200; // Starting z-index for images (above button z-index: 100)

    // Generate the correct filename based on index
    function getImagePath(index) {
      return `memes/flork_${index}.jpg`;
    }

    // Clear all effects on an image
    function clearImageEffects(imageIndex) {
      const image = allImageElements[imageIndex];
      if (!image) return;
      
      // Clear any pending effect timeout
      if (effectTimeouts[imageIndex]) {
        clearTimeout(effectTimeouts[imageIndex]);
        delete effectTimeouts[imageIndex];
      }
      
      // Reset all effects (preserve centering)
      image.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
      image.style.filter = 'brightness(1) contrast(1) saturate(1) hue-rotate(0deg) blur(0px)';
      image.style.boxShadow = '0 0 20px rgba(255, 0, 150, 0.3)'; // Default glow
      image.style.animation = 'none';
    }

    // Create and preload all image elements
    function preloadAllImages() {
      console.log("🖼️ Creating and preloading all image elements...");
      let loadedCount = 0;
      const loadingIndicator = document.getElementById('loadingIndicator');
      const loadingText = document.querySelector('.loading-text');
      const startButtonContainer = document.querySelector('.start-button-container');
      
      // Create container for all images
      const imageContainer = document.createElement('div');
      imageContainer.id = 'imageContainer';
      imageContainer.style.position = 'absolute';
      imageContainer.style.top = '0';
      imageContainer.style.left = '0';
      imageContainer.style.width = '100%';
      imageContainer.style.height = '100%';
      imageContainer.style.pointerEvents = 'none';
      imageContainer.style.zIndex = '10'; // Above scanlines (2) but below loading indicator (1000)
      document.body.appendChild(imageContainer);
      
      for (let i = 1; i <= total; i++) {
        // Create actual DOM image element
        const img = document.createElement('img');
        img.src = getImagePath(i);
        img.className = 'meme-layer';
        img.style.position = 'absolute';
        img.style.top = '50%';
        img.style.left = '50%';
        img.style.transform = 'translate(-50%, -50%)';
        img.style.maxWidth = '400px';
        img.style.maxHeight = '400px';
        img.style.objectFit = 'contain';
        img.style.opacity = '0'; // Start hidden
        img.style.display = 'none'; // Start hidden
        img.style.transition = 'none'; // No transitions for instant changes
        img.style.borderRadius = '10px';
        img.style.boxShadow = '0 0 20px rgba(255, 0, 150, 0.3)';
        img.style.zIndex = currentZIndex + i; // Each image gets a unique z-index
        
        // Add to container
        imageContainer.appendChild(img);
        allImageElements[i] = img;
        
        img.onload = () => {
          loadedCount++;
          console.log(`📸 Loaded ${loadedCount}/${total} images`);
          
          if (loadedCount === total) {
            imagesPreloaded = true;
            console.log("✅ All images loaded! Ready for instant transitions.");
            
            // Hide loading indicator
            loadingIndicator.style.opacity = '0';
            setTimeout(() => {
              loadingIndicator.style.display = 'none';
              
              // Show start button
              startButtonContainer.style.display = 'block';
            }, 500);
          }
        };
        
        img.onerror = () => {
          console.warn(`⚠️ Failed to load image: ${getImagePath(i)}`);
          loadedCount++;
          
          if (loadedCount === total) {
            imagesPreloaded = true;
            console.log("✅ Image loading completed (with some errors).");
            
            // Hide loading indicator
            loadingIndicator.style.opacity = '0';
            setTimeout(() => {
              loadingIndicator.style.display = 'none';
              
              // Show start button
              startButtonContainer.style.display = 'block';
            }, 500);
          }
        };
      }
    }

    // Show a specific image by index (INSTANT - no fade transitions)
    function showImage(imageIndex) {
      // Hide current image instantly
      if (currentVisibleImage) {
        // Find the index of current image and clear its effects
        const currentIndex = allImageElements.indexOf(currentVisibleImage);
        if (currentIndex !== -1) {
          clearImageEffects(currentIndex);
        }
        
        // INSTANT hide - no fade
        currentVisibleImage.style.display = 'none';
        currentVisibleImage.style.opacity = '0';
      }
      
      // Show new image instantly
      const newImage = allImageElements[imageIndex];
      if (newImage) {
        // Clear any existing effects on the new image
        clearImageEffects(imageIndex);
        
        // Ensure this image has the highest z-index
        currentZIndex += 1;
        newImage.style.zIndex = currentZIndex;
        
        // INSTANT show - no fade
        newImage.style.display = 'block';
        newImage.style.opacity = '1';
        currentVisibleImage = newImage;
      }
    }

    // Start preloading immediately when page loads
    window.addEventListener('load', () => {
      preloadAllImages();
    });

    // Get current intensity from comprehensive audio analysis - BALANCED VERSION
    function getCurrentIntensity(currentTime) {
      if (timingMap.length === 0) return 0.5; // Default if no timing map
      
      // Use the comprehensive audio state function
      const audioState = getCurrentAudioState(currentTime);
      
      // Combine multiple factors for balanced dynamic response
      const intensity = audioState.intensity;
      const rhythmSpeed = audioState.rhythmSpeed;
      const energy = audioState.energy;
      const bpm = audioState.bpm;
      
      // Create a balanced intensity calculation
      // Base intensity from beat detection
      let finalIntensity = intensity;
      
      // Strong boost intensity based on rhythm speed (more responsive to fast music)
      const speedBoost = Math.min(0.4, (rhythmSpeed - 1.0) * 0.2);
      finalIntensity += speedBoost;
      
      // Moderate boost intensity based on energy peaks
      const energyBoost = Math.min(0.3, energy * 0.4);
      finalIntensity += energyBoost;
      
      // Strong boost intensity based on BPM (more responsive to fast BPM)
      const bpmBoost = Math.min(0.3, (bpm - 100) / 200);
      finalIntensity += bpmBoost;
      
      // Add subtle random variation for natural feel
      const randomVariation = (Math.random() - 0.5) * 0.1; // ±5% variation
      finalIntensity += randomVariation;
      
      // Scale to 0.2-1.0 range for balanced effect
      finalIntensity = Math.max(0.2, Math.min(1.0, finalIntensity));
      
      return finalIntensity;
    }

    function toggleStart() {
      if (isPlaying) {
        pause();
      } else {
        start();
      }
    }

    async function start() {
      try {
        if (!audio) {
          // Create audio element if it doesn't exist
          audio = new Audio("sound_short.mp3");
          audio.loop = true;
          audio.startTime = Date.now();
        }
        
        // Resume audio
        await audio.play();
        isPlaying = true;
        
        // Update button
        startButton.classList.remove('stopped');
        startButton.classList.add('playing');
        startButton.querySelector('.button-text').textContent = 'PAUSE';
        
        // Show first image
        showImage(1);
        
        // Hide button after a short delay
        setTimeout(() => {
          startButton.style.opacity = '0';
          startButton.style.pointerEvents = 'none';
        }, 1000);
        
        // Start rhythm-based image changes
        startRhythmDisplay();
        
        console.log("🎵 Audio started successfully, rhythm display started");
        
      } catch (error) {
        console.log("Audio start failed:", error);
        // Don't show alert if audio is actually playing
        if (!audio.paused) {
          console.log("🎵 Audio is actually playing despite error");
          isPlaying = true;
          startRhythmDisplay();
        } else {
          alert("Audio failed to start. Make sure the sound.mp3 file exists in the same folder.");
        }
      }
    }

    function pause() {
      isPlaying = false;
      
      if (audio) {
        audio.pause();
      }
      
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      
      // Clear all effect timeouts and reset current image
      for (let i = 1; i <= total; i++) {
        if (effectTimeouts[i]) {
          clearTimeout(effectTimeouts[i]);
          delete effectTimeouts[i];
        }
        clearImageEffects(i);
      }
      
      // Show button again
      startButton.style.opacity = '1';
      startButton.style.pointerEvents = 'auto';
      startButton.classList.remove('playing');
      startButton.classList.add('stopped');
      startButton.querySelector('.button-text').textContent = 'START';
    }

    function startRhythmDisplay() {
      if (!isPlaying) {
        console.log("🎵 Rhythm display stopped - not playing");
        return;
      }
      
      const now = Date.now();
      const currentTime = audio ? audio.currentTime : 0; // Use actual audio time
      
      // Get comprehensive audio state for advanced timing
      const audioState = getCurrentAudioState(currentTime);
      const intensity = audioState.intensity;
      const energy = audioState.energy;
      const bpm = audioState.bpm;
      const rhythmSpeed = audioState.rhythmSpeed;
      const interval = audioState.interval;
      
      // SILENCE DETECTION - Check if no sound is playing
      const silenceThreshold = 0.01; // Very low energy indicates silence
      const isSilent = energy < silenceThreshold && intensity < 0.05;
      
      if (isSilent) {
        console.log(`🔇 SILENCE DETECTED - Time: ${currentTime.toFixed(1)}s, Energy: ${energy.toFixed(3)}, Intensity: ${intensity.toFixed(3)}`);
        
        // During silence, fade out the current image and don't change images
        if (currentVisibleImage) {
          currentVisibleImage.style.opacity = '0.3'; // Fade to 30% opacity during silence
          currentVisibleImage.style.filter = 'brightness(0.5) contrast(0.7) saturate(0.5)'; // Make it more subtle
          currentVisibleImage.style.boxShadow = '0 0 10px rgba(255, 0, 150, 0.1)'; // Very subtle glow
          currentVisibleImage.style.animation = 'none'; // Stop animations during silence
        }
        
        // Continue the loop but don't change images
        animationId = requestAnimationFrame(startRhythmDisplay);
        return;
      }
      
      // RESTORE IMAGE VISIBILITY when sound returns
      if (currentVisibleImage && currentVisibleImage.style.opacity === '0.3') {
        currentVisibleImage.style.opacity = '1'; // Restore full opacity
        currentVisibleImage.style.filter = 'brightness(1) contrast(1) saturate(1)'; // Restore normal appearance
        currentVisibleImage.style.boxShadow = '0 0 20px rgba(255, 0, 150, 0.3)'; // Restore normal glow
      }
      
      console.log(`🎵 Rhythm display running - Time: ${currentTime.toFixed(1)}s, Intensity: ${intensity.toFixed(3)}, Energy: ${energy.toFixed(3)}`);
      
      // EXTREME MUSICAL TIMING - Much more aggressive for fast music
      let displayTime;
      
      if (interval && interval > 0) {
        // Use actual beat intervals from music analysis for perfect sync
        const baseInterval = interval * 1000; // Convert to milliseconds
        
        // MUCH MORE AGGRESSIVE multipliers for fast music
        const intensityMultiplier = 0.2 + (intensity * 1.8); // 0.2x to 2.0x (was 0.5x to 1.5x)
        const energyMultiplier = 0.3 + (energy * 1.4); // 0.3x to 1.7x (was 0.7x to 1.3x)
        const rhythmMultiplier = 0.4 + ((rhythmSpeed - 1.0) * 1.2); // 0.4x to 1.6x (was 0.8x to 1.2x)
        const bpmMultiplier = 0.3 + ((bpm - 135) / 200) * 1.0; // BPM-based multiplier
        
        // Combine multipliers for EXTREME musical timing
        const combinedMultiplier = (intensityMultiplier + energyMultiplier + rhythmMultiplier + bpmMultiplier) / 4;
        displayTime = baseInterval * combinedMultiplier;
        
        // MUCH MORE AGGRESSIVE bounds for fast music
        displayTime = Math.max(50, Math.min(1500, displayTime)); // 50ms to 1500ms (was 150ms to 2000ms)
      } else {
        // Fallback to BPM-based timing - MORE AGGRESSIVE
        const bpmMultiplier = 60000 / bpm; // Convert BPM to milliseconds per beat
        const intensityFactor = 0.2 + (intensity * 1.8); // Much more aggressive
        const energyFactor = 0.3 + (energy * 1.4); // Much more aggressive
        displayTime = bpmMultiplier * intensityFactor * energyFactor;
      }
      
      // Debug logging for musical timing
      if (Math.floor(currentTime) !== Math.floor(currentTime - 0.1)) {
        console.log(`🎵 Time: ${currentTime.toFixed(1)}s | BPM: ${bpm.toFixed(1)} | Intensity: ${intensity.toFixed(3)} | Energy: ${energy.toFixed(3)} | Rhythm: ${rhythmSpeed.toFixed(2)} | Display: ${displayTime.toFixed(0)}ms`);
      }
      
      // Change image if enough time has passed
      if (now - lastImageTime > displayTime) {
        changeImage();
        lastImageTime = now;
      }
      
      // Continue rhythm analysis
      animationId = requestAnimationFrame(startRhythmDisplay);
    }

    function changeImage() {
      // Get next image
      index = (index % total) + 1;
      
      console.log(`🖼️ Changing to image ${index}`);
      
      // Get comprehensive audio state for advanced visual effects
      const currentTime = audio ? audio.currentTime : 0;
      const audioState = getCurrentAudioState(currentTime);
      const intensity = getCurrentIntensity(currentTime);
      
      // Show the new image instantly
      showImage(index);
      
      // Apply visual effects to the newly shown image instantly
      const newImage = allImageElements[index];
      if (!newImage) return;
      
      // Ensure this image has the highest z-index during effects
      currentZIndex += 1;
      newImage.style.zIndex = currentZIndex;
      console.log(`🎨 Image ${index} z-index: ${currentZIndex}`);
      
      // ADVANCED MUSICAL VISUAL EFFECTS - Using comprehensive audio analysis
      const speedMultiplier = Math.min(2.5, audioState.rhythmSpeed);
      const energy = audioState.energy;
      const bpm = audioState.bpm;
      const rhythmSpeed = audioState.rhythmSpeed;
      const interval = audioState.interval;
      const beatType = audioState.type;
      
      // EXTREME SCALE: Much more dramatic scaling for maximum visual impact
      const energyScale = 1 + (energy * 2.0); // Energy-based scaling (2.0x range - was 1.2x) - MUCH MORE DRAMATIC
      const bpmScale = 1 + ((bpm - 135) / 200) * 1.5; // BPM-based scaling (1.5x range - was 0.8x) - MUCH MORE DRAMATIC
      const intensityScale = 1 + (intensity * 1.8); // Intensity-based scaling (1.8x range - was 0.9x) - MUCH MORE DRAMATIC
      const rhythmScale = 1 + ((rhythmSpeed - 1.0) * 1.2); // Rhythm speed scaling (1.2x range - was 0.7x) - MUCH MORE DRAMATIC
      const beatTypeScale = beatType === 'strong' ? 1.6 : 1.0; // Strong beats get MUCH BIGGER (1.6x - was 1.4x)
      const intervalScale = interval ? 1 + ((0.5 - interval) * 1.2) : 1.0; // Fast intervals = MUCH BIGGER (1.2x - was 0.8x)
      
      // Additional scaling factors that match the glow effect responsiveness
      const glowBasedScale = 1 + (Math.min(0.5, (energy + intensity + (rhythmSpeed - 1.0)) / 3)); // Combined glow factors (0.5x - was 0.3x)
      const beatResponseScale = beatType === 'strong' ? 1.25 : 1.0; // Extra boost for strong beats (1.25x - was 1.15x)
      const musicIntensityScale = 1 + (Math.min(0.4, (energy * intensity * (rhythmSpeed - 1.0)))); // Music intensity multiplier
      
      // EXTREME PEAK DETECTION - Massive scaling boost for peak notes
      const peakThreshold = 0.7; // High threshold for detecting peaks
      const isPeak = energy > peakThreshold || intensity > peakThreshold || (energy > 0.6 && intensity > 0.6);
      const peakScale = isPeak ? 2.5 : 1.0; // 2.5x scaling boost during peaks
      
      // ULTRA PEAK DETECTION - Even more extreme for maximum peaks
      const ultraPeakThreshold = 0.8; // Very high threshold for ultra peaks
      const isUltraPeak = energy > ultraPeakThreshold && intensity > ultraPeakThreshold;
      const ultraPeakScale = isUltraPeak ? 4.0 : 1.0; // 4.0x scaling boost during ultra peaks
      
      // RHYTHM PEAK DETECTION - Fast rhythm peaks
      const rhythmPeakThreshold = 1.5; // Fast rhythm threshold
      const isRhythmPeak = rhythmSpeed > rhythmPeakThreshold && (energy > 0.5 || intensity > 0.5);
      const rhythmPeakScale = isRhythmPeak ? 1.8 : 1.0; // 1.8x scaling boost during rhythm peaks
      
      const scale = energyScale * bpmScale * intensityScale * rhythmScale * beatTypeScale * intervalScale * glowBasedScale * beatResponseScale * musicIntensityScale * peakScale * ultraPeakScale * rhythmPeakScale;
        
      // EXTREME BRIGHTNESS & CONTRAST: Much more aggressive for fast music
      const energyBrightness = 1 + (energy * 1.0); // Energy-based brightness (1.0x range - was 0.5x)
      const bpmBrightness = 1 + ((bpm - 135) / 200) * 0.8; // BPM-based brightness (0.8x range - was 0.4x)
      const intensityBrightness = 1 + (intensity * 0.8); // Intensity-based brightness (0.8x range - was 0.4x)
      const beatTypeBrightness = beatType === 'strong' ? 1.4 : 1.0; // Strong beats MUCH brighter (was 1.2)
      const rhythmBrightness = 1 + ((rhythmSpeed - 1.0) * 0.6); // Rhythm-based brightness (0.6x range - was 0.3x)
      
      const brightness = Math.min(3.5, energyBrightness * bpmBrightness * intensityBrightness * beatTypeBrightness * rhythmBrightness);
      
      // EXTREME CONTRAST: Much more aggressive contrast
      const energyContrast = 1 + (energy * 0.6); // Energy-based contrast (0.6x range - was 0.3x)
      const bpmContrast = 1 + ((bpm - 135) / 300) * 0.4; // BPM-based contrast (0.4x range - was 0.2x)
      const intensityContrast = 1 + (intensity * 0.4); // Intensity-based contrast (0.4x range - was 0.2x)
      const beatTypeContrast = beatType === 'strong' ? 1.3 : 1.0; // Strong beats MUCH more contrast (was 1.15)
      
      const contrast = Math.min(2.5, energyContrast * bpmContrast * intensityContrast * beatTypeContrast);
      
      // EXTREME SATURATION: Much more aggressive saturation
      const rhythmSaturation = 1 + ((rhythmSpeed - 1.0) * 0.8); // Rhythm-based saturation (0.8x range - was 0.4x)
      const energySaturation = 1 + (energy * 0.6); // Energy-based saturation (0.6x range - was 0.3x)
      const bpmSaturation = 1 + ((bpm - 135) / 200) * 0.4; // BPM-based saturation (0.4x range - was 0.2x)
      const intensitySaturation = 1 + (intensity * 0.4); // Intensity-based saturation (0.4x range - was 0.2x)
      const beatTypeSaturation = beatType === 'strong' ? 1.2 : 1.0; // Strong beats MUCH more saturated (was 1.1)
      
      const saturation = Math.min(3.0, rhythmSaturation * energySaturation * bpmSaturation * intensitySaturation * beatTypeSaturation);
      
      // EXTREME ROTATION: Much more dramatic rotation for maximum visual impact
      const beatRotation = (intensity * 80) * (Math.random() > 0.5 ? 1 : -1); // Beat-based rotation (80x - was 40x) - MUCH MORE DRAMATIC
      const bpmRotation = ((bpm - 135) / 50) * 50; // BPM-based rotation (50x - was 25x) - MUCH MORE DRAMATIC
      const energyRotation = energy * 60 * (Math.random() > 0.5 ? 1 : -1); // Energy-based rotation (60x - was 30x) - MUCH MORE DRAMATIC
      const rhythmRotation = (rhythmSpeed - 1.0) * 70 * (Math.random() > 0.5 ? 1 : -1); // Rhythm-based rotation (70x - was 35x) - MUCH MORE DRAMATIC
      const beatTypeRotation = beatType === 'strong' ? 30 * (Math.random() > 0.5 ? 1 : -1) : 0; // Strong beats rotate MUCH MORE (30x - was 15x)
      const intervalRotation = interval ? ((0.5 - interval) * 40) * (Math.random() > 0.5 ? 1 : -1) : 0; // Fast intervals rotate MUCH MORE (40x - was 20x)
      
      // Additional rotation factors for maximum impact
      const glowBasedRotation = (energy + intensity + (rhythmSpeed - 1.0)) * 25 * (Math.random() > 0.5 ? 1 : -1); // Glow-based rotation
      const musicIntensityRotation = (energy * intensity * (rhythmSpeed - 1.0)) * 20 * (Math.random() > 0.5 ? 1 : -1); // Music intensity rotation
      
      // EXTREME PEAK ROTATION - Massive rotation boost for peak notes
      const peakRotation = isPeak ? 120 * (Math.random() > 0.5 ? 1 : -1) : 0; // 120° rotation boost during peaks
      const ultraPeakRotation = isUltraPeak ? 200 * (Math.random() > 0.5 ? 1 : -1) : 0; // 200° rotation boost during ultra peaks
      const rhythmPeakRotation = isRhythmPeak ? 80 * (Math.random() > 0.5 ? 1 : -1) : 0; // 80° rotation boost during rhythm peaks
      
      const rotation = beatRotation + bpmRotation + energyRotation + rhythmRotation + beatTypeRotation + intervalRotation + glowBasedRotation + musicIntensityRotation + peakRotation + ultraPeakRotation + rhythmPeakRotation;
      
      // Debug logging for scaling and rotation (after all variables are declared)
      if (Math.floor(currentTime) !== Math.floor(currentTime - 0.1)) {
        console.log(`📏 Scaling - Energy: ${energyScale.toFixed(2)}, BPM: ${bpmScale.toFixed(2)}, Intensity: ${intensityScale.toFixed(2)}, Rhythm: ${rhythmScale.toFixed(2)}, Beat: ${beatTypeScale.toFixed(2)}, Glow: ${glowBasedScale.toFixed(2)}, Peak: ${peakScale.toFixed(2)}, Ultra: ${ultraPeakScale.toFixed(2)}, Final: ${scale.toFixed(2)}`);
        console.log(`🌀 Rotation - Beat: ${beatRotation.toFixed(1)}°, BPM: ${bpmRotation.toFixed(1)}°, Energy: ${energyRotation.toFixed(1)}°, Rhythm: ${rhythmRotation.toFixed(1)}°, BeatType: ${beatTypeRotation.toFixed(1)}°, Peak: ${peakRotation.toFixed(1)}°, Ultra: ${ultraPeakRotation.toFixed(1)}°, Final: ${rotation.toFixed(1)}°`);
        if (isPeak || isUltraPeak || isRhythmPeak) {
          console.log(`🚀 PEAK DETECTED! - Energy: ${energy.toFixed(3)}, Intensity: ${intensity.toFixed(3)}, Rhythm: ${rhythmSpeed.toFixed(2)}, Peak: ${isPeak}, Ultra: ${isUltraPeak}, Rhythm: ${isRhythmPeak}`);
        }
      }
      
      // EXTREME HUE SHIFT: Much more aggressive color changes for fast music
      const bpmHue = (bpm - 135) * 3.0; // BPM-based hue (3.0x - was 1.5x)
      const energyHue = energy * 160 * (Math.random() > 0.5 ? 1 : -1); // Energy-based hue (160x - was 80x)
      const rhythmHue = (rhythmSpeed - 1.0) * 120 * (Math.random() > 0.5 ? 1 : -1); // Rhythm-based hue (120x - was 60x)
      const intensityHue = intensity * 80 * (Math.random() > 0.5 ? 1 : -1); // Intensity-based hue (80x - was 40x)
      const beatTypeHue = beatType === 'strong' ? 60 * (Math.random() > 0.5 ? 1 : -1) : 0; // Strong beats shift MUCH more (60x - was 30x)
      const intervalHue = interval ? ((0.5 - interval) * 40) * (Math.random() > 0.5 ? 1 : -1) : 0; // Fast intervals shift MUCH more (40x - was 20x)
      
      const hueShift = bpmHue + energyHue + rhythmHue + intensityHue + beatTypeHue + intervalHue;
      
      // Apply transforms (keep centered - no position movement)
      newImage.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${rotation}deg)`;
      newImage.style.filter = `brightness(${brightness}) contrast(${contrast}) saturate(${saturation}) hue-rotate(${hueShift}deg)`;
      
      // EXTREME MUSICAL GLOW EFFECTS - Much more aggressive for fast music
      const glowThreshold = 0.1; // Much lower threshold for more responsive glows (was 0.2)
      
      if (energy > glowThreshold || intensity > 0.2 || beatType === 'strong') {
        // EXTREME multi-factor glow size calculation
        const energyGlow = energy * 60; // Energy-based glow size (60x - was 30x)
        const bpmGlow = ((bpm - 135) / 100) * 40; // BPM-based glow size (40x - was 20x)
        const intensityGlow = intensity * 50; // Intensity-based glow size (50x - was 25x)
        const rhythmGlow = (rhythmSpeed - 1.0) * 30; // Rhythm-based glow size (30x - was 15x)
        const beatTypeGlow = beatType === 'strong' ? 40 : 0; // Strong beats get MUCH bigger glow (40x - was 20x)
        const intervalGlow = interval ? ((0.5 - interval) * 20) : 0; // Fast intervals get MUCH bigger glow (20x - was 10x)
        
        const glowIntensity = energyGlow + bpmGlow + intensityGlow + rhythmGlow + beatTypeGlow + intervalGlow;
        
        // Advanced color variations using all music data
        const bpmHue = (bpm / 2) % 360; // BPM-based hue
        const energyHue = (energy * 180 + 180) % 360; // Energy-based hue
        const rhythmHue = (rhythmSpeed * 60) % 360; // Rhythm-based hue
        const intensityHue = (intensity * 120 + 240) % 360; // Intensity-based hue
        
        // Multi-layer glow colors
        const glowColor1 = `hsla(${bpmHue}, 80%, 60%, ${Math.min(0.8, energy * 0.9)})`;
        const glowColor2 = `hsla(${energyHue}, 80%, 60%, ${Math.min(0.6, intensity * 0.7)})`;
        const glowColor3 = `hsla(${rhythmHue}, 80%, 60%, ${Math.min(0.4, rhythmSpeed * 0.5)})`;
        
        if (energy > 0.5 || rhythmSpeed > 1.3 || beatType === 'strong' || intensity > 0.6) {
          // Triple glow layers for high energy/fast rhythm/strong beats
          newImage.style.boxShadow = `
            0 0 ${glowIntensity}px ${glowColor1},
            0 0 ${glowIntensity * 1.5}px ${glowColor2},
            0 0 ${glowIntensity * 2}px ${glowColor3}
          `;
        } else if (energy > 0.3 || intensity > 0.4) {
          // Double glow layers for moderate energy
          newImage.style.boxShadow = `
            0 0 ${glowIntensity}px ${glowColor1},
            0 0 ${glowIntensity * 1.3}px ${glowColor2}
          `;
        } else {
          // Single glow for low energy
          newImage.style.boxShadow = `0 0 ${glowIntensity}px ${glowColor1}`;
        }
      } else {
        newImage.style.boxShadow = '0 0 20px rgba(255, 0, 150, 0.3)'; // Default subtle glow
      }
      
      // Add subtle blur effect for very high intensity
      if (intensity > 0.9) {
        const blurAmount = (intensity - 0.9) * 2; // 0 to 0.2px blur
        newImage.style.filter += ` blur(${blurAmount}px)`;
      }
      
      // EXTREME ANIMATION SELECTION - Much more aggressive for fast music
      const animationThreshold = 0.2; // Much lower threshold for more responsive animations (was 0.4)
      
      if (intensity > animationThreshold || energy > 0.2 || beatType === 'strong') {
        // EXTREME multi-factor animation speed calculation
        const baseSpeed = 300; // Much faster base animation speed (300ms - was 500ms)
        const intensitySpeed = 1 / (intensity * 3); // Much more aggressive intensity speed (3x - was 2x)
        const energySpeed = 1 / (energy * 2.5); // Much more aggressive energy speed (2.5x - was 1.5x)
        const bpmSpeed = 1 / ((bpm - 135) / 100 + 1); // BPM affects speed (centered on 135)
        const rhythmSpeedMultiplier = 1 / (rhythmSpeed * 1.2); // Much more aggressive rhythm speed (1.2x - was 0.8x)
        const beatTypeSpeed = beatType === 'strong' ? 0.5 : 1.0; // Strong beats MUCH faster (0.5x - was 0.7x)
        
        const combinedSpeed = (intensitySpeed + energySpeed + bpmSpeed + rhythmSpeedMultiplier) / 4;
        const animationSpeed = baseSpeed * combinedSpeed * beatTypeSpeed;
        
        // EXTREME animation selection based on multiple factors
        if (energy > 0.4 || rhythmSpeed > 1.2 || beatType === 'strong' || intensity > 0.6) {
          // Maximum intensity - use glitch effect (lower thresholds)
          newImage.style.animation = `extremeGlitch ${Math.max(50, animationSpeed)}ms infinite`;
        } else if (energy > 0.2 || rhythmSpeed > 1.0 || intensity > 0.4) {
          // High intensity - intense pulse (lower thresholds)
          newImage.style.animation = `extremePulse ${Math.max(75, animationSpeed)}ms infinite alternate`;
        } else if (energy > 0.1 || intensity > 0.2) {
          // Moderate intensity - gentle pulse (lower thresholds)
          newImage.style.animation = `extremePulse ${Math.max(100, animationSpeed * 1.2)}ms infinite alternate`;
        } else {
          // Low intensity - no animation
          newImage.style.animation = 'none';
        }
      } else {
        newImage.style.animation = 'none';
      }
      
      // Reset effects after a short time
      effectTimeouts[index] = setTimeout(() => {
        newImage.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
        newImage.style.filter = 'brightness(1) contrast(1) saturate(1) hue-rotate(0deg) blur(0px)';
        newImage.style.boxShadow = '0 0 20px rgba(255, 0, 150, 0.3)'; // Reset to default glow
        newImage.style.animation = 'none';
        delete effectTimeouts[index];
      }, 300);
    }
  </script>
